<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 | Lynn</title>
  <meta name="description" content="Lynn 的博客：日常感想、随笔与 vlog 记录。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <div class="site-wrap">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/">
          <span class="brand__mark">Lynn</span>
          <span class="brand__tag">lynnstrip.com</span>
        </a>
        <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">菜单</button>
        <nav class="nav" id="site-nav" data-nav aria-label="主导航">
          <a class="nav__link" href="/">首页</a>
          <a class="nav__link" href="/about/">关于</a>
          <a class="nav__link" href="/projects/">项目</a>
          <a class="nav__link" href="/code/">代码</a>
          <a class="nav__link" href="/travel/">旅行</a>
          <a class="nav__link is-active" href="/blog/">博客</a>
          <a class="nav__link" href="/contact/">联系</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <p class="eyebrow">Blog</p>
      <h1 class="page-title">博客</h1>
      <p class="page-lead">日常感想、随笔与 vlog。适合放短记录、阶段性想法，或外链到视频平台。</p>

      <div class="stack">
        <article class="block">
          <div class="block__meta">Thought · Placeholder</div>
          <h2 class="block__title">一篇日常感想（占位）</h2>
          <p class="block__text">之后可在这里写短文，或链到完整文章页。配图也可以直接嵌在正文里。</p>
        </article>
        <article class="block">
          <div class="block__meta">Vlog · Placeholder</div>
          <h2 class="block__title">一条 vlog 记录（占位）</h2>
          <p class="block__text">可放标题、摘要，并链接到 Bilibili / YouTube 等平台。</p>
        </article>
      </div>

      <div class="photo-row" aria-hidden="true">
        <figure>
          <img src="/images/IMG_5208.JPG" alt="" width="1022" height="1200" loading="lazy">
        </figure>
        <figure>
          <img src="/images/IMG_5225.JPG" alt="" width="790" height="1076" loading="lazy">
        </figure>
      </div>

      <div class="placeholder" style="margin-top: 24px;">
        <strong>待补充</strong><br>
        · 第一篇真实感想 / 记录<br>
        · vlog 平台链接（如有）
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>© <span data-year></span> Lynn · lynnstrip.com</p>
        <p><a href="/travel/">旅行</a></p>
      </div>
    </footer>
  </div>
  <script src="/assets/js/site.js"></script>
  <script>document.querySelectorAll("[data-year]").forEach(el => el.textContent = new Date().getFullYear());</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>摄影 | Lynn</title>
  <meta name="description" content="Lynn 的摄影作品集。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <div class="site-wrap">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/">
          <span class="brand__mark">Lynn</span>
          <span class="brand__tag">lynnstrip.com</span>
        </a>
        <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">菜单</button>
        <nav class="nav" id="site-nav" data-nav aria-label="主导航">
          <a class="nav__link" href="/">首页</a>
          <a class="nav__link" href="/about/">关于</a>
          <a class="nav__link" href="/projects/">项目</a>
          <a class="nav__link" href="/code/">代码</a>
          <a class="nav__link" href="/travel/">旅行</a>
          <a class="nav__link is-active" href="/photography/">摄影</a>
          <a class="nav__link" href="/contact/">联系</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <p class="eyebrow">Photography</p>
      <h1 class="page-title">摄影</h1>
      <p class="page-lead">照片作品集骨架。先用现有旅行照片占位，之后可换成你想展示的系列。</p>

      <div class="photo-grid">
        <figure>
          <img src="/images/IMG_5208.JPG" alt="旅行摄影占位 1" width="1022" height="1200" loading="lazy">
        </figure>
        <figure>
          <img src="/images/IMG_5225.JPG" alt="旅行摄影占位 2" width="790" height="1076" loading="lazy">
        </figure>
        <figure class="placeholder" style="display: grid; place-items: center; aspect-ratio: 4 / 5; margin: 0;">
          更多照片待补充
        </figure>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>© <span data-year></span> Lynn · lynnstrip.com</p>
        <p><a href="/travel/">旅行</a></p>
      </div>
    </footer>
  </div>
  <script src="/assets/js/site.js"></script>
  <script>document.querySelectorAll("[data-year]").forEach(el => el.textContent = new Date().getFullYear());</script>
</body>
</html>
